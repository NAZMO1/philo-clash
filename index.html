<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhiloClash</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
  <main class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
    <div class="w-full bg-slate-800 h-2 rounded-full mb-6 overflow-hidden">
      <div id="timer-bar" class="bg-amber-400 h-full w-full transition-all duration-100 ease-linear"></div>
    </div>
    <div class="flex justify-between items-center text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">
      <span id="question-progress">Question 1/15</span>
      <span id="score-display">Score : 0</span>
    </div>
    <div class="min-h-[140px] flex items-center justify-center text-center p-4 bg-slate-950/60 rounded-xl border border-slate-800/80 mb-6">
      <p id="quote-text" class="text-lg font-medium leading-relaxed italic text-slate-200">Chargement...</p>
    </div>
    <div id="choices-container" class="grid grid-cols-1 gap-3 mb-6"></div>
    <div id="lesson-card" class="hidden bg-slate-800/90 border border-amber-500/30 rounded-xl p-4 mb-4">
      <div id="answer-status" class="font-bold text-sm mb-1"></div>
      <p id="quote-context" class="text-xs text-amber-400/90 font-mono mb-2"></p>
      <p id="lesson-text" class="text-xs text-slate-300 leading-relaxed"></p>
      <button id="next-btn" class="w-full mt-4 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-sm transition">
        Question suivante
      </button>
    </div>
  </main>

  <script>
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 12;
    const TOTAL_TIME = 12;

    const quoteText = document.getElementById('quote-text');
    const choicesContainer = document.getElementById('choices-container');
    const questionProgress = document.getElementById('question-progress');
    const scoreDisplay = document.getElementById('score-display');
    const timerBar = document.getElementById('timer-bar');
    const lessonCard = document.getElementById('lesson-card');
    const answerStatus = document.getElementById('answer-status');
    const quoteContext = document.getElementById('quote-context');
    const lessonText = document.getElementById('lesson-text');
    const nextBtn = document.getElementById('next-btn');

    fetch('./questions.json')
      .then(response => {
        if (!response.ok) throw new Error("Erreur");
        return response.json();
      })
      .then(data => {
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error("Aucune question disponible");
        }
        questions = data;
        startGame();
      })
      .catch(err => {
        quoteText.textContent = "Erreur : questions.json introuvable.";
      });

    function startGame() {
      currentIndex = 0;
      score = 0;
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timerInterval);
      lessonCard.classList.add('hidden');
      choicesContainer.innerHTML = '';
      
      const q = questions[currentIndex];
      questionProgress.textContent = `Question ${currentIndex + 1}/${questions.length}`;
      scoreDisplay.textContent = `Score : ${score}`;
      quoteText.textContent = `« ${q.quote} »`;

      q.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = "choice-btn w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 active:scale-[0.99] border border-slate-700/60 rounded-xl text-left font-medium text-sm transition text-slate-200";
        btn.textContent = choice;
        btn.onclick = () => validateAnswer(choice);
        choicesContainer.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      timeLeft = TOTAL_TIME;
      timerBar.style.width = '100%';
      timerBar.classList.replace('bg-rose-500', 'bg-amber-400');

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        const pct = Math.max(0, (timeLeft / TOTAL_TIME) * 100);
        timerBar.style.width = `${pct}%`;

        if (timeLeft <= 3.5) {
          timerBar.classList.replace('bg-amber-400', 'bg-rose-500');
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          validateAnswer(null);
        }
      }, 100);
    }

    function validateAnswer(selectedChoice) {
      clearInterval(timerInterval);
      if (!lessonCard.classList.contains('hidden')) return;
      const q = questions[currentIndex];
      const buttons = document.querySelectorAll('.choice-btn');

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.author) {
          btn.classList.add('!bg-emerald-600', '!border-emerald-500', 'text-white');
        } else if (btn.textContent === selectedChoice) {
          btn.classList.add('!bg-rose-600', '!border-rose-500', 'text-white');
        }
      });

      const isCorrect = (selectedChoice === q.author);
      if (isCorrect) score += 1;

      answerStatus.textContent = isCorrect ? "Exact !" : (selectedChoice ? "Raté !" : "Temps écoulé !");
      answerStatus.className = `font-bold text-sm mb-1 ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}`;
      quoteContext.textContent = `${q.author} — ${q.context}`;
      lessonText.textContent = q.mini_lesson;

      lessonCard.classList.remove('hidden');
    }

    nextBtn.onclick = () => {
      currentIndex++;
      if (currentIndex < questions.length) {
        loadQuestion();
      } else {
        quoteText.textContent = `Partie terminée ! Score : ${score} / ${questions.length}`;
        choicesContainer.innerHTML = '';
        lessonCard.classList.add('hidden');
        timerBar.style.width = '0%';
        const restartBtn = document.createElement('button');
        restartBtn.className = "w-full py-3 bg-amber-500 text-slate-950 font-bold rounded-xl mt-4";
        restartBtn.textContent = "Rejouer";
        restartBtn.onclick = startGame;
        choicesContainer.appendChild(restartBtn);
      }
    };
  </script>
</body>
</html>
